<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>your_feedback</title>
</head>
<body>

    <div>
        <h1>Feedback</h1>
        <p>We value your feedback! Please let us know your thoughts and suggestions about our recipes. Your input helps us improve and provide you with the best culinary experience.</p>
        <form action="home_page.html" method="get">
            <label for="name">Name:</label><br>
            <input type="text" id="name" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" required><br><br>

            <label for="feedback">Feedback:</label><br>
            <textarea id="feedback" rows="5" required></textarea><br><br>

            <input type="submit" value="Submit Feedback">
        </form>
    </div>
</body>
</html>
